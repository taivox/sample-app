services:
  db:
    image: postgres:17-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres_test
      POSTGRES_PASSWORD: postgres_test
      POSTGRES_DB: postgres_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres_test"]
      interval: 1s
      retries: 10
      timeout: 1s

  run-tests:
    image: golang:1.25.6-alpine3.23
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      POSTGRES_USER: postgres_test
      POSTGRES_PASSWORD: postgres_test
      POSTGRES_DB: postgres_test
      POSTGRES_SERVER_HOST: db
      CLIENT_URL: http://localhost:3000
      SERVER_PORT: ":8081"
      JWT_KEY: secretive
      RUN_MIGRATION: "true"
    depends_on:
      db:
        condition: service_healthy
    command: go test ./... -v
